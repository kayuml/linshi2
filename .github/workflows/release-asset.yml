name: Build and Upload Release Asset

on:
  release:
    types: [published]

jobs:
  build-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Create ZIP archive
        run: |
          # 排除 .git、.github、.gitignore、README.md、requirements.txt
          # 使用英文命名以符合 GitHub Release Asset 规范
          zip -r "MRNewGameLauncher40.0.zip" . -x ".git*" -x ".github/*" -x ".gitignore" -x "README.md" -x "requirements.txt"
          
      - name: Upload asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "MRNewGameLauncher40.0.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
